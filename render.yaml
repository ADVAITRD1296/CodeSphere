services:
  - type: web
    name: codesphere-server
    runtime: node
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false          # Set this in Render dashboard
      - key: CLIENT_URL
        sync: false          # Set to your Vercel frontend URL after deploying
    healthCheckPath: /health
