services:
  - type: web
    name: codesphere-server
    runtime: node
    # Root is the monorepo root so npm workspaces resolve @codesphere/shared correctly
    rootDir: .
    buildCommand: npm install && cd packages/shared && npm run build && cd ../../apps/server && npm run build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false          # Set this in Render dashboard
      - key: CLIENT_URL
        sync: false          # Set to your Vercel frontend URL after deploying
    healthCheckPath: /health
