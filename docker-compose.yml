version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codesphere_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codesphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codesphere"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=codesphere_super_secret_jwt_key_32bytes_min!
      - REFRESH_SECRET=codesphere_super_secret_refresh_key_32bytes!
      - CLIENT_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/codesphere?schema=public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000/ws/collaboration
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
